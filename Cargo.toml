[package]
name = "ext4"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "1.2.1"
fs_core = { path = "fs-core" }
synchronizations = { path = "lib/synchronizations" }
hashbrown = "0.9.0"
num_enum = { version = "0.5.0", default-features = false }

[dev-dependencies]
rand = { version = "*" }
crossbeam-utils = { version = "0.8", default-features = false }

[features]
default = ["dblock_cache", "extent_cache"]

no_std = ["fs_core/no_std"]
extern_print = []
trace_ext4 = []
extent_cache = []
dblock_cache = []
